name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare fixed signing key (from GitHub Secrets)
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "No signing secret available (e.g. fork) - falling back to default debug signing."
            exit 0
          fi
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/aicall.keystore"
          chmod 600 "$RUNNER_TEMP/aicall.keystore"
          echo "AICALL_KEYSTORE_FILE=$RUNNER_TEMP/aicall.keystore" >> "$GITHUB_ENV"
          echo "Fixed signing keystore prepared."

      - name: Build debug APK
        env:
          AICALL_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          AICALL_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          AICALL_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk AICall-debug.apk

      - name: Keep APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AICall-debug-apk
          path: AICall-debug.apk

      - name: Publish to fixed download link (release "latest-debug")
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-debug --yes --cleanup-tag || true
          gh release create latest-debug AICall-debug.apk \
            --title "최신 테스트 APK" \
            --notes "main 최신 커밋(${GITHUB_SHA::7})으로 자동 빌드된 테스트용 APK입니다. 폰에서 AICall-debug.apk를 눌러 설치하세요." \
            --prerelease --target "$GITHUB_SHA"
