name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck (client)
        run: npm run lint
      - name: Typecheck (server.ts)
        run: npx tsc --noEmit --module esnext --moduleResolution bundler --target es2022 --types node --skipLibCheck --esModuleInterop server.ts
      - name: Build
        run: npm run build
      - name: Test (if present)
        run: npm test --if-present
